# Automated releases for Mira.
#
# Security model — why others can't cut a release without the owner:
#   * It only runs on PUSH to `main` (and manual dispatch). `main` is a protected
#     branch, so code reaches it only through a pull request the owner merges.
#     Fork pull requests never run this with write access.
#   * It uses the built-in GITHUB_TOKEN (the github-actions bot) — no personal
#     name/email, no personal access token, no third-party secrets.
#   * Permissions are least-privilege: read everywhere, `contents: write` only
#     on the job that publishes the release.
#
# What it does: computes the next vX.Y.Z tag, builds the Debian package (and the
# Windows .exe once the `mira-win` crate exists), and publishes a GitHub Release
# with those artifacts attached.

name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide the next tag: bump the patch of the latest v* tag, with the
  # Cargo.toml version as a floor (lets you jump minor/major via Cargo.toml).
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      has_windows: ${{ steps.v.outputs.has_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -euo pipefail
          # The Windows job can't use hashFiles() in its job-level `if`, so we
          # detect the crate here (repo is checked out) and expose a flag.
          if [ -f crates/mira-win/Cargo.toml ]; then
            echo "has_windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_windows=false" >> "$GITHUB_OUTPUT"
          fi
          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            version="$cargo_ver"
          else
            base="${latest#v}"
            ma="${base%%.*}"
            rest="${base#*.}"
            mi="${rest%%.*}"
            pa="${rest##*.}"
            pa=$((pa + 1))
            bumped="${ma}.${mi}.${pa}"
            version="$(printf '%s\n%s\n' "$cargo_ver" "$bumped" | sort -V | tail -n1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Next release: v$version"

  build-linux:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin dpkg-dev zip
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the .deb
        env:
          MIRA_VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mira-deb
          path: target/debian/*.deb
          if-no-files-found: error

  # Activates automatically once crates/mira-win exists. Skipped until then.
  build-windows:
    runs-on: windows-latest
    needs: version
    if: ${{ needs.version.outputs.has_windows == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - name: Build the Windows binary
        env:
          MIRA_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release -p mira-win
      - name: Collect the .exe
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/mira*.exe dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: mira-windows
          path: dist/*.exe
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    needs: [version, build-linux, build-windows]
    if: ${{ always() && needs.build-linux.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the Linux package
        uses: actions/download-artifact@v4
        with:
          name: mira-deb
          path: artifacts
      - name: Download the Windows binary (if built)
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: mira-windows
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Mira $TAG" \
            --generate-notes \
            artifacts/*
