name: Android preview
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck && npm run lint && npm test -- --runInBand
        working-directory: mobile
      - run: ./gradlew assemblePreviewRelease testPreviewDebugUnitTest --console=plain
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: mira-android-preview
          path: mobile/android/app/build/outputs/apk/preview/release/*.apk
          if-no-files-found: error
