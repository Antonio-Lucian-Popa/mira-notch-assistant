[workspace]
resolver = "2"
members = [
    "crates/mira-core",
    "crates/mira-platform-linux",
    "crates/mira-daemon",
    "crates/mira-win",
]

# OS-specific code is cfg-gated so the workspace checks on both platforms.

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mira contributors"]
repository = "https://github.com/antonio-lucian-popa/mira-notch-assistant"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
thiserror = "1"
async-trait = "0.1"
dirs = "5"

# HTTP client for LRCLIB. rustls so we carry no system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# Local persistence. `bundled` compiles its own SQLite, so no system libsqlite needed.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
