[package]
name = "mira-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Linux data sources for Mira (MPRIS media, UPower battery) over D-Bus."

[dependencies]
mira-core = { path = "../mira-core" }
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# tokio runtime only (no async-io); `proxy` brings the #[zbus::proxy] macro.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
