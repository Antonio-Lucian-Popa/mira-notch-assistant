[package]
name = "mira-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OS-agnostic core logic for Mira: state model, event bus, source traits, LRC/LRCLIB lyrics, and local persistence."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }

chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
qrcodegen = "1.8"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
# Extract the GOWA gateway binary from its release zip (deflate only to stay lean).
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "test-util"] }
tempfile = "3"
