[package]
name = "mira-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mira-core = { path = "../mira-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_System_Shutdown"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Media_Control", "Foundation", "Win32_System_WinRT"]
